<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Книга</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2 th:text="${book.getBookTitle() + ', ' + book.getBookAuthor() + ', ' + book.getYearOfBook()}"></h2>

<div th:if="${owner}" class="my-3">
    <p>Книга сейчас у: <strong th:text="${owner.getFullName()}">Person Name</strong></p>
    <form th:method="PATCH" th:action="@{/books/{bookId}/release(bookId=${book.getBookId()})}">
        <button type="submit" class="btn btn-warning">Освободить книгу</button>
    </form>
</div>

<div th:if="${people}" class="my-3">
    <p>Эта книга свободна. Кому назначить её?</p>
    <form th:method="PATCH" th:action="@{/books/{id}/assign(id=${book.getBookId()})}">
        <div class="mb-3">
            <label for="person" class="form-label">Выберите человека</label>
            <select th:object="${person}" th:field="*{personId}" id="person" class="form-select">
                <option th:each="person : ${people}" th:value="${person.getPersonId()}" th:text="${person.getFullName()}"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Назначить книгу</button>
    </form>
</div>

<hr class="my-4"/>

<form th:method="GET" th:action="@{/books/{id}/edit(id=${book.getBookId()})}" class="d-inline">
    <button type="submit" class="btn btn-secondary">Редактировать</button>
</form>

<form th:method="DELETE" th:action="@{/books/{id}(id=${book.getBookId()})}" class="d-inline">
    <button type="submit" class="btn btn-danger">Удалить</button>
</form>

</body>
</html>
