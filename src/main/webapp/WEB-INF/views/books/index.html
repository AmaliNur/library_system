<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список книг</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h1 class="mb-4">Список книг</h1>

<div class="list-group">
    <a class="list-group-item list-group-item-action" th:each="book : ${books}"
       th:href="@{/books/{id}(id=${book.getBookId()})}"
       th:text="${book.getBookTitle() + ', ' + book.getBookAuthor() + ', ' + book.getYearOfBook()}">
        book
    </a>
</div>

<hr class="my-4"/>

<a class="btn btn-primary" href="/books/new">Добавить книгу</a>

</body>
</html>
