<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Изменить книгу</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2 class="mb-4">Редактировать книгу</h2>

<form th:method="PATCH" th:action="@{/books/{bookId}(bookId=${book.getBookId()})}" th:object="${book}">
    <div class="mb-3">
        <label for="bookTitle" class="form-label">Введите название книги:</label>
        <input type="text" th:field="*{bookTitle}" id="bookTitle" class="form-control"/>
        <div class="text-danger" th:if="${#fields.hasErrors('bookTitle')}" th:errors="*{bookTitle}"></div>
    </div>
    <div class="mb-3">
        <label for="bookAuthor" class="form-label">Введите автора:</label>
        <input type="text" th:field="*{bookAuthor}" id="bookAuthor" class="form-control"/>
        <div class="text-danger" th:if="${#fields.hasErrors('bookAuthor')}" th:errors="*{bookAuthor}"></div>
    </div>
    <div class="mb-3">
        <label for="yearOfBook" class="form-label">Введите год:</label>
        <input type="text" th:field="*{yearOfBook}" id="yearOfBook" class="form-control"/>
        <div class="text-danger" th:if="${#fields.hasErrors('yearOfBook')}" th:errors="*{yearOfBook}"></div>
    </div>
    <button type="submit" class="btn btn-success">Редактировать!</button>
</form>

</body>
</html>
