<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Добавить нового человека</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

<h2 class="mb-4">Добавить нового человека</h2>

<form th:method="POST" th:action="@{/people}" th:object="${person}" class="needs-validation">
    <div class="mb-3">
        <label for="fullName" class="form-label">ФИО:</label>
        <input type="text" th:field="*{fullName}" id="fullName" class="form-control"/>
        <div class="text-danger" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
    </div>

    <div class="mb-3">
        <label for="yearOfBirth" class="form-label">Год рождения:</label>
        <input type="text" th:field="*{yearOfBirth}" id="yearOfBirth" class="form-control"/>
        <div class="text-danger" th:if="${#fields.hasErrors('yearOfBirth')}" th:errors="*{yearOfBirth}"></div>
    </div>

    <button type="submit" class="btn btn-success">Создать!</button>
</form>

</body>
</html>
